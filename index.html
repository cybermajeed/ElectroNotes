<!doctype html>
<html>
  <head>
    <meta name="version" content="24.6.1" />
    <meta name="developer" content="CyberMajeed" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electro Notes</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./assets/ElectroNote.png" />
  </head>
  <body>
    <div class="imgWrapper">
      <img class="imgViewer" src="" alt="" />
    </div>

    <div class="container">
      <div class="brand">
        <img src="./assets/ElectroNote.png" alt="" />
        <span>Electro Notes</span>
      </div>
      <div class="topNavParent">
        <input
          class="searchForNotes"
          title="Search Note"
          placeholder="Search Notes"
        />
        <button class="hideSidebar" title="Hide Sidebar"></button>
      </div>
      <div class="notesList"></div>
      <div class="addNoteParent">
        <button class="addNote" title="Add Note"></button>
      </div>
    </div>

    <div class="wrapper noViewMsgWrapper">
      <div class="topParentForTitleDelInEditView editAreaDisabled">
        <input
          type="text"
          class="noteTitleInEditView"
          placeholder="Title"
          maxlength="100"
        />
        <button class="noteColor" title="Change Theme"></button>
        <button class="pinNote" title="Pin Note"></button>
        <div class="colorPalette">
          <button
            class="colorSet"
            style="--background: #fff; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #1d1d1d; --color: #fff"
          ></button>
          <button
            class="colorSet"
            style="--background: #fbfb7d; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #15ffb1; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #d081fd; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #72fcfc; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #fe77d5; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #85fd93; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #ffe5b4; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #ffaf6e; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #f98888; --color: #000"
          ></button>
          <button
            class="colorSet"
            style="--background: #d3d3d3; --color: #000"
          ></button>
        </div>
        <button class="deleteNote" title="Delete Note"></button>
      </div>

      <div
        class="formatToolbar editAreaDisabled"
        aria-label="Formatting toolbar"
      >
        <select
          class="headingSelect"
          title="Heading Level"
          aria-label="Heading Level"
        >
          <option value="">Text</option>
          <option value="h1">H1</option>
          <option value="h2">H2</option>
          <option value="h3">H3</option>
        </select>
        <span class="toolbarDivider"></span>
        <button
          data-action="taskList"
          title="Checkbox / Task List"
          aria-label="Checkbox / Task List"
        ></button>
        <button data-command="bold" title="Bold" aria-label="Bold"></button>
        <button
          data-command="italic"
          title="Italic"
          aria-label="Italic"
        ></button>
        <button
          data-command="underline"
          title="Underline"
          aria-label="Underline"
        ></button>
        <button
          data-command="strikeThrough"
          title="Strikethrough"
          aria-label="Strikethrough"
        ></button>
        <span class="toolbarDivider"></span>
        <button
          data-action="codeBlock"
          title="Code Block"
          aria-label="Code Block"
        ></button>
        <button
          data-action="highlight"
          title="Highlight Text"
          aria-label="Highlight Text"
        ></button>
        <label class="textColorControl" title="Text Color">
          <span>A</span>
          <input type="color" class="textColorInput" value="#0c1118" />
        </label>
        <span class="toolbarDivider"></span>
        <button
          data-command="justifyLeft"
          title="Align Left"
          aria-label="Align Left"
        ></button>
        <button
          data-command="justifyCenter"
          title="Align Center"
          aria-label="Align Center"
        ></button>
        <button
          data-command="justifyRight"
          title="Align Right"
          aria-label="Align Right"
        ></button>
        <button
          data-action="insertHR"
          title="Horizontal Divider"
          aria-label="Horizontal Divider"
        ></button>
        <button
          data-command="outdent"
          title="Outdent"
          aria-label="Outdent"
        ></button>
        <button
          data-command="indent"
          title="Indent"
          aria-label="Indent"
        ></button>
        <button
          data-action="createLink"
          title="Insert Link"
          aria-label="Insert Link"
        ></button>
        <button
          data-command="unlink"
          title="Remove Link"
          aria-label="Remove Link"
        ></button>
        <button
          data-action="increaseFont"
          title="Increase Font"
          aria-label="Increase Font"
        ></button>
        <button
          data-action="decreaseFont"
          title="Decrease Font"
          aria-label="Decrease Font"
        ></button>
        <button
          data-command="superscript"
          title="Superscript"
          aria-label="Superscript"
        ></button>
        <button
          data-command="subscript"
          title="Subscript"
          aria-label="Subscript"
        ></button>
        <button
          data-action="insertTable"
          title="Insert Table"
          aria-label="Insert Table"
        ></button>
        <button
          data-action="toggleCollapse"
          title="Toggle Collapse Section"
          aria-label="Toggle Collapse Section"
        ></button>
        <span class="toolbarDivider"></span>
        <button
          data-command="insertUnorderedList"
          title="Bullet List"
          aria-label="Bullet List"
        ></button>
        <button
          data-command="insertOrderedList"
          title="Numbered List"
          aria-label="Numbered List"
        ></button>
        <button
          data-command="formatBlock"
          data-value="blockquote"
          title="Quote"
          aria-label="Quote"
        ></button>
        <span class="toolbarDivider"></span>
        <button
          data-command="removeFormat"
          title="Clear Formatting"
          aria-label="Clear Formatting"
        ></button>
      </div>

      <div
        class="noteContentInEditView editAreaDisabled"
        placeholder="Type Here"
      ></div>
      <div class="wordCount">0 W; 0 C</div>
      <div class="noViewMsg">Open a Note</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
